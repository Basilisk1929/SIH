name: CyberShield Intel CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test, Lint & Migrations (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyber_user
          POSTGRES_PASSWORD: ChangeMeInProd_123!
          POSTGRES_DB: cyber_intel_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      SYNTHETIC_DATA_ONLY: "True"
      DEBUG: "False"
      DATABASE_URL: "postgresql+asyncpg://cyber_user:ChangeMeInProd_123!@localhost:5432/cyber_intel_db"
      JWT_SECRET_KEY: "ci-synthetic-test-key-not-for-production-use-only-for-automated-github-actions"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      NEO4J_URI: "bolt://localhost:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "ci-test-password"
      REDIS_URL: "redis://localhost:6379/0"
      ALLOWED_CORS_ORIGINS: '["http://localhost:5173"]'
      PYTHONPATH: "."

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Static Code Analysis & Lint (Ruff)
        run: |
          ruff check .

      - name: Apply Database Migrations (Alembic)
        run: |
          alembic upgrade head

      - name: Run Pytest Comprehensive Test Suite
        run: |
          pytest -v --tb=short

  frontend-check:
    name: Frontend Typecheck, Tests & Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run lint

      - name: Run Vitest Unit & Component Tests
        run: npm test -- --run

      - name: Build Production Bundle
        env:
          VITE_API_BASE_URL: "/api/v1"
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "CRITICAL: dist/index.html was not generated!"; exit 1; }

  docker-ci:
    name: Docker Infrastructure & Image Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Mock Environment for Compose Validation
        run: |
          cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Build Backend Docker Image
        run: |
          docker build -t cybershield-backend:ci -f docker/Dockerfile.backend .

      - name: Build Frontend Production Docker Image
        run: |
          docker build --target production -t cybershield-frontend:ci -f docker/Dockerfile.frontend ./frontend

  security-scan:
    name: Security & Secret Leak Prevention
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify No Sensitive Files Are Tracked
        run: |
          FORBIDDEN=(".env" ".env.local" ".env.production" "id_rsa" "id_rsa.pub")
          for file in "${FORBIDDEN[@]}"; do
            if git ls-files --error-unmatch "$file" 2>/dev/null; then
              echo "CRITICAL SECURITY VIOLATION: $file is tracked in Git repository!"
              exit 1
            fi
          done
          echo "Verified: No forbidden secret files are tracked in Git."

      - name: Scan for Plaintext Private Keys
        run: |
          if git grep -E -- "-----BEGIN [A-Z]+ PRIVATE KEY-----" ":!docs"; then
            echo "CRITICAL SECURITY VIOLATION: Unencrypted private key detected in repository!"
            exit 1
          fi
          echo "Verified: No private cryptographic keys detected in tracked source files."
