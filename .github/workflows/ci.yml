name: CyberShield Intel CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Test & Lint (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyber-intelligence/backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff httpx

      - name: Lint Code with Ruff
        run: |
          ruff check app/

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: development
          SYNTHETIC_DATA_ONLY: "True"
          DEBUG: "True"
        run: |
          cd .. && pytest tests/ -v

  frontend-check:
    name: Frontend Build & Typecheck (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyber-intelligence/frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: cyber-intelligence/frontend/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Type Check
        run: npm run lint

      - name: Build Production Assets
        run: npm run build

  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyber-intelligence

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          docker compose config --quiet
