version: '3.8'

services:
  # Relational Database: Structured Complaints, Transactions, Users, Audit Logs
  postgres:
    image: postgres:16-alpine
    container_name: cyber_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyber_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyber_dev_password_123!}
      POSTGRES_DB: ${POSTGRES_DB:-cyber_intelligence_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyber_admin} -d ${POSTGRES_DB:-cyber_intelligence_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Graph Database: Multi-hop Money Flow, Mule Rings, Shared Identifier Graph
  neo4j:
    image: neo4j:5.18.0-community
    container_name: cyber_intel_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cyber_graph_password_123!}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - ./docker/neo4j-init.cypher:/var/lib/neo4j/import/init.cypher:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # In-Memory Cache & Message Broker: Real-time alerts, rate limits, async jobs
  redis:
    image: redis:7.2-alpine
    container_name: cyber_intel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API Server: Python 3.12 + FastAPI Modular Engine
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cyber_intel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cyber_admin}:${POSTGRES_PASSWORD:-cyber_dev_password_123!}@postgres:5432/${POSTGRES_DB:-cyber_intelligence_db}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-cyber_graph_password_123!}
      - REDIS_URL=redis://redis:6379/0
      - SYNTHETIC_DATA_ONLY=True
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./ml:/app/ml
      - ./nlp:/app/nlp
      - ./graph:/app/graph
      - ./geo:/app/geo
      - ./ingestion:/app/ingestion
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Web UI: React 18 + TypeScript + Vite Dashboard
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cyber_intel_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
