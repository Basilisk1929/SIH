# ==============================================================================
# CyberShield-Intel Platform — Render Blueprint (Infrastructure as Code)
# Provisions: Web Service (FastAPI) + Managed PostgreSQL
# Neo4j Aura must be provisioned separately at https://neo4j.com/cloud/aura/
# ==============================================================================

services:
  - type: web
    name: cybershield-intel-backend
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SYNTHETIC_DATA_ONLY
        value: "True"
      - key: AUTO_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: ALLOWED_CORS_ORIGINS
        value: '["https://frontend-bay-tau-86.vercel.app","http://localhost:5173"]'
      - key: NEO4J_URI
        sync: false  # Must be set manually after provisioning Neo4j Aura
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: REDIS_URL
        value: ""  # Redis not required for core operation

databases:
  - name: cybershield-postgres
    databaseName: cyber_intelligence_db
    user: cyber_admin
    plan: free
    region: oregon
    postgresMajorVersion: "16"
